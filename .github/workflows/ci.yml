name: CI — FreeLanceScrapper

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Compilación (py_compile)"
        run: python -m py_compile fiverr_ddg_scraper.py scraper_sgai.py gdrive_auth.py

      - name: "Validar scripts shell"
        run: bash -n run_scraper.sh
